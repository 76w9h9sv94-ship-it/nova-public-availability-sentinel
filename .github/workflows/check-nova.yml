name: NOVA external availability
on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: nova-external-availability
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public HTTPS, login and sanitized health
        shell: bash
        run: |
          node <<'NODE'
          const origin = 'https://projekt.ricovo.se';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function check() {
            const [login, health] = await Promise.all([
              fetch(origin + '/login', { signal: AbortSignal.timeout(8000), redirect: 'manual', cache: 'no-store' }),
              fetch(origin + '/api/v1/health', { signal: AbortSignal.timeout(8000), redirect: 'manual', cache: 'no-store' })
            ]);
            if (!login.ok || !health.ok) throw new Error('Public HTTPS check failed: login=' + login.status + ', health=' + health.status);
            if (!(await login.text()).includes('Logga in')) throw new Error('Login page content check failed');
            const state = await health.json();
            if (state?.ok !== true || state.database !== 'reachable' || !Number.isFinite(Date.parse(state.timestamp)) || Date.now() - Date.parse(state.timestamp) > 4 * 60_000) throw new Error('Sanitized health response is unhealthy or stale');
            console.log('NOVA public availability PASS at ' + new Date().toISOString());
          }
          let last;
          for (let attempt = 1; attempt <= 3; attempt++) {
            try { await check(); process.exit(0); }
            catch (error) { last = error; if (attempt < 3) await sleep(10000); }
          }
          console.error('NOVA external availability failed after three attempts: ' + last.message);
          process.exit(1);
          NODE
